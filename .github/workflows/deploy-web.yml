name: Déployer le web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Ignoré tant que les variables du dépôt ne sont pas renseignées.
    if: ${{ vars.SUPABASE_URL != '' && vars.SUPABASE_ANON_KEY != '' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Tolère un préfixe « NOM= », des espaces, des guillemets et une barre
      # oblique finale dans les variables du dépôt.
      - name: Vérifier la configuration
        env:
          RAW_URL: ${{ vars.SUPABASE_URL }}
          RAW_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          url="$(printf '%s' "$RAW_URL" | tr -d '[:space:]"')"
          url="${url##*=}"
          url="$(printf '%s' "$url" | sed 's:/*$::')"
          key="$(printf '%s' "$RAW_KEY" | tr -d '[:space:]"')"
          key="${key##*=}"
          case "$url" in
            https://*.supabase.co) ;;
            *) echo "::error::SUPABASE_URL lue : '$url'. Attendu : https://xxx.supabase.co"; exit 1 ;;
          esac
          if [ -z "$key" ]; then echo "::error::SUPABASE_ANON_KEY est vide."; exit 1; fi
          echo "::add-mask::$key"
          echo "SUPABASE_URL=$url" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$key" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - name: Compiler le web
        run: >-
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deployment
        uses: actions/deploy-pages@v4
